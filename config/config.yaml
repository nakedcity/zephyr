
authorization:
  enabled: false
  token_env_var: "OPEN_API_KEY"

cache:
  directory: "./cache"
  max_loaded_models: 2

models:
  bge-small-en-v1.5:
    repo: "Xenova/bge-small-en-v1.5"
    dimension: 384
    max_tokens: 512
    quantize: false  # INT8 quantization is slower on GTX 1080 (Pascal architecture)
    engine: "migraphx"
    batch_size: 32  # Optimal for GTX 1080 8GB VRAM with FP32
    owner: "Xenova"
  all-MiniLM-L6-v2:
    repo: "Xenova/all-MiniLM-L6-v2"
    dimension: 384
    max_tokens: 256
    quantize: true
    engine: "cpu"
    batch_size: 128  # CPU can handle larger batches
    owner: "Xenova"

preload:
  - bge-small-en-v1.5

workers:
  cuda:
    port: 5001
  migraphx:
    port: 5002
  rocm:
    port: 5004
  cpu:
    port: 5003
